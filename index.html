<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OVW SMASH Wrestling</title>
<style>*{margin:0;padding:0}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;flex-direction:column;touch-action:none;user-select:none}
#touch-controls{display:none;position:fixed;bottom:0;left:0;right:0;height:180px;pointer-events:none;z-index:1000}
#touch-controls.active{display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.dpad{position:relative;width:150px;height:150px;pointer-events:auto}
.dpad button{position:absolute;width:50px;height:50px;border:none;border-radius:10px;background:rgba(255,255,255,0.25);color:#fff;font-size:20px;font-weight:bold;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.dpad button:active{background:rgba(255,255,255,0.5)}
.dpad .up{top:0;left:50px}.dpad .down{bottom:0;left:50px}.dpad .left{top:50px;left:0}.dpad .right{top:50px;left:100px}
.actions{display:flex;gap:12px;flex-wrap:wrap;width:180px;justify-content:center;pointer-events:auto}
.actions button{width:56px;height:56px;border:none;border-radius:50%;font-size:12px;font-weight:bold;color:#fff;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.actions button:active{transform:scale(0.9)}
.btn-z{background:rgba(255,50,50,0.6)}.btn-x{background:rgba(50,150,255,0.6)}.btn-c{background:rgba(255,200,0,0.6)}.btn-block{background:rgba(100,100,100,0.6)}.btn-space{background:rgba(50,255,50,0.6);width:70px;border-radius:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head><body><script>
const ROSTER = [
  {name:'Z-Force',style:'Champion',pow:7,spd:7,sta:7,tec:7,c1:0xffd700,c2:0xffa500},
  {name:'Big Zo',style:'Powerhouse',pow:10,spd:4,sta:8,tec:5,c1:0x8b0000,c2:0xff0000},
  {name:'Star Rider',style:'Highflyer',pow:5,spd:10,sta:6,tec:8,c1:0x0000ff,c2:0xadd8e6},
  {name:'Evil Z',style:'Dirty Tricks',pow:6,spd:7,sta:7,tec:8,c1:0x4b0082,c2:0x800080},
  {name:'Freya The Slaya',style:'Aggressive',pow:8,spd:8,sta:6,tec:6,c1:0xffc0cb,c2:0xff69b4},
  {name:'Crixus',style:'Brawler',pow:9,spd:5,sta:9,tec:5,c1:0x808000,c2:0x9acd32},
  {name:'Ca$h Flo',style:'Technical',pow:5,spd:7,sta:6,tec:10,c1:0x008000,c2:0x32cd32},
  {name:'Mad Dog Martin',style:'Unpredictable',pow:8,spd:8,sta:5,tec:4,c1:0xff4500,c2:0xff6347},
  {name:'Oaken',style:'Iron Oak',pow:9,spd:6,sta:10,tec:6,c1:0x8b4513,c2:0xd2691e},
  {name:'Arlo',style:'The Flash',pow:6,spd:10,sta:7,tec:8,c1:0x1e90ff,c2:0x008080},
  {name:'Theo',style:'Wildcard',pow:7,spd:9,sta:6,tec:9,c1:0x800080,c2:0xda70d6},
  {name:'Cody Rhodes',style:'American Nightmare',pow:8,spd:8,sta:8,tec:9,c1:0xffffff,c2:0x000080}
];

class TitleScene extends Phaser.Scene {
  constructor(){super('TitleScene')}
  create(){
    this.started=false;
    this.add.rectangle(400,300,800,600,0x1a1a2e);
    this.add.text(400,80,'OVW SMASH',{fontSize:'64px',fontFamily:'Impact',color:'#ff4444'}).setOrigin(0.5);
    this.add.text(400,140,'WRESTLING',{fontSize:'32px',color:'#ffdd44'}).setOrigin(0.5);
    this.selectedP1=0; this.selectedP2=1;
    this.p1Text=this.add.text(200,200,'',{fontSize:'20px',color:'#fff'}).setOrigin(0.5);
    this.p2Text=this.add.text(600,200,'',{fontSize:'20px',color:'#fff'}).setOrigin(0.5);
    this.add.text(200,180,'< YOUR FIGHTER >',{fontSize:'14px',color:'#aaa'}).setOrigin(0.5);
    this.add.text(600,180,'< OPPONENT >',{fontSize:'14px',color:'#aaa'}).setOrigin(0.5);
    this.updateDisplay();
    // Draw previews
    this.p1Gfx=this.add.graphics();this.p2Gfx=this.add.graphics();
    this.drawPreview(this.p1Gfx,200,350,this.selectedP1);
    this.drawPreview(this.p2Gfx,600,350,this.selectedP2);
    this.add.text(400,500,'LEFT/RIGHT = select fighter | A/D = select opponent\nENTER to fight!',{fontSize:'14px',color:'#ccc',align:'center'}).setOrigin(0.5);
    this.add.text(790,590,'v0.6',{fontSize:'12px',color:'#666'}).setOrigin(1);
    this.add.text(400,550,'Controls: Arrows=Move Z=Strike X=Grapple C=Finisher DOWN=Block',{fontSize:'12px',color:'#888'}).setOrigin(0.5);
    this.input.keyboard.on('keydown-LEFT',()=>{this.selectedP1=(this.selectedP1+ROSTER.length-1)%ROSTER.length;this.updateDisplay()});
    this.input.keyboard.on('keydown-RIGHT',()=>{this.selectedP1=(this.selectedP1+1)%ROSTER.length;this.updateDisplay()});
    this.input.keyboard.on('keydown-A',()=>{this.selectedP2=(this.selectedP2+ROSTER.length-1)%ROSTER.length;this.updateDisplay()});
    this.input.keyboard.on('keydown-D',()=>{this.selectedP2=(this.selectedP2+1)%ROSTER.length;this.updateDisplay()});
    this.input.keyboard.on('keydown-ENTER',()=>{
      if(this.started)return;this.started=true;
      this.scene.start('FightScene',{p1:this.selectedP1,p2:this.selectedP2});
    });
  }
  updateDisplay(){
    const r1=ROSTER[this.selectedP1],r2=ROSTER[this.selectedP2];
    this.p1Text.setText(r1.name+'\n'+r1.style+'\nPOW:'+r1.pow+' SPD:'+r1.spd+' STA:'+r1.sta+' TEC:'+r1.tec);
    this.p2Text.setText(r2.name+'\n'+r2.style+'\nPOW:'+r2.pow+' SPD:'+r2.spd+' STA:'+r2.sta+' TEC:'+r2.tec);
    if(this.p1Gfx){this.p1Gfx.clear();this.drawPreview(this.p1Gfx,200,350,this.selectedP1);}
    if(this.p2Gfx){this.p2Gfx.clear();this.drawPreview(this.p2Gfx,600,350,this.selectedP2);}
  }
  drawPreview(g,x,y,idx){
    const r=ROSTER[idx];
    g.fillStyle(r.c1);g.fillCircle(x,y-40,16);
    g.fillStyle(r.c2);g.fillRoundedRect(x-14,y-22,28,36,6);
    g.fillStyle(r.c1);g.fillRect(x-22,y-18,8,28);g.fillRect(x+14,y-18,8,28);
    g.fillStyle(r.c2);g.fillRect(x-10,y+16,8,24);g.fillRect(x+2,y+16,8,24);
  }
}

class FightScene extends Phaser.Scene {
  constructor(){super('FightScene')}
  init(data){this.p1Idx=data.p1;this.p2Idx=data.p2;this.p1Wins=data.p1Wins||0;this.p2Wins=data.p2Wins||0;this.round=(data.round||0)+1;}
  create(){
    this.drawRing();
    const r1=ROSTER[this.p1Idx],r2=ROSTER[this.p2Idx];
    this.p1={x:280,y:350,hp:100,maxHp:100,stamina:100,finisher:0,combo:0,blocking:false,hitTimer:0,data:r1,facingRight:true};
    this.p2={x:520,y:350,hp:100,maxHp:100,stamina:100,finisher:0,combo:0,blocking:false,hitTimer:0,data:r2,facingRight:false};
    this.p1Gfx=this.add.graphics();this.p2Gfx=this.add.graphics();
    this.hudGfx=this.add.graphics();
    this.bounceT=0;this.pinActive=false;this.pinTarget=null;this.pinMarker=0;this.pinDir=1;
    this.gameOver=false;this.aiTimer=0;this.aiAction=null;this.aiDashCooldown=0;
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keys={z:this.input.keyboard.addKey('Z'),x:this.input.keyboard.addKey('X'),c:this.input.keyboard.addKey('C'),space:this.input.keyboard.addKey('SPACE')};
    this.cooldown=0;
    this.floatingTexts=[];
    this.add.text(400,30,'Round '+this.round+' of 3',{fontSize:'16px',color:'#fff'}).setOrigin(0.5);
    this.add.text(400,50,this.p1Wins+' - '+this.p2Wins,{fontSize:'14px',color:'#ff0'}).setOrigin(0.5);
    // Pin UI (hidden)
    this.pinGfx=this.add.graphics().setVisible(false);
    this.pinText=this.add.text(400,280,'MASH SPACE in GREEN to kick out!',{fontSize:'16px',color:'#fff'}).setOrigin(0.5).setVisible(false);
  }
  drawRing(){
    const g=this.add.graphics();
    // Crowd silhouettes
    for(let i=0;i<40;i++){g.fillStyle(0x111122);g.fillCircle(20+i*20,50+Math.sin(i)*10,12);g.fillRect(14+i*20,60+Math.sin(i)*10,12,20);}
    for(let i=0;i<40;i++){g.fillStyle(0x0a0a1a);g.fillCircle(30+i*20,80+Math.cos(i)*8,10);g.fillRect(24+i*20,88+Math.cos(i)*8,12,16);}
    // Mat
    g.fillStyle(0x2244aa);g.fillRect(150,250,500,220);
    g.fillStyle(0x1a3388);g.fillRect(170,270,460,180);
    // Posts
    g.fillStyle(0xcccccc);
    g.fillRect(148,245,12,230);g.fillRect(640,245,12,230);
    g.fillRect(148,245,12,8);g.fillRect(640,245,12,8);
    // top posts (visual)
    g.fillStyle(0xff4444);g.fillCircle(154,245,8);g.fillCircle(646,245,8);g.fillCircle(154,470,8);g.fillCircle(646,470,8);
    // Bottom posts
    g.fillRect(148,465,12,10);g.fillRect(640,465,12,10);
    // Ropes
    for(let i=0;i<3;i++){
      let ry=260+i*35;
      g.lineStyle(3,0xffffff,0.8);
      g.lineBetween(154,ry,646,ry);// top
    }
    for(let i=0;i<3;i++){
      let ry=395+i*25;
      g.lineStyle(2,0xffffff,0.5);
      g.lineBetween(154,ry,646,ry);// bottom (perspective)
    }
  }
  drawWrestler(g,p,bounce){
    g.clear();
    const x=p.x,y=p.y+bounce;
    const d=p.data;const flash=p.hitTimer>0?0xffffff:null;
    // Legs
    g.fillStyle(flash||d.c2);
    g.fillRect(x-10,y+16,8,26);g.fillRect(x+2,y+16,8,26);
    // Torso
    g.fillStyle(flash||d.c2);g.fillRoundedRect(x-15,y-22,30,40,7);
    // Arms
    g.fillStyle(flash||d.c1);
    const armOff=p.blocking?0:Math.sin(this.bounceT*4)*3;
    g.fillRect(x-24,y-16+armOff,10,28);g.fillRect(x+14,y-16-armOff,10,28);
    // Head
    g.fillStyle(flash||d.c1);g.fillCircle(x,y-34,16);
    // Eyes
    g.fillStyle(0xffffff);g.fillCircle(x-(p.facingRight?3:-3),y-36,3);g.fillCircle(x+(p.facingRight?7:- 7),y-36,3);
    if(p.blocking){g.lineStyle(3,0x00ffff,0.7);g.strokeCircle(x,y-5,35);}
  }
  update(time,delta){
    if(this.gameOver)return;
    this.bounceT+=delta*0.003;
    const b1=Math.sin(this.bounceT*3)*3;
    const b2=Math.sin(this.bounceT*3+1)*3;
    if(this.pinActive){this.updatePin(delta);this.drawWrestler(this.p1Gfx,this.p1,b1);this.drawWrestler(this.p2Gfx,this.p2,b2);this.drawHUD();return;}
    // Player input
    this.cooldown-=delta;
    const spd=this.p1.data.spd*0.4+1;
    this.p1.blocking=this.cursors.down.isDown;
    if(!this.p1.blocking){
      if(this.cursors.left.isDown){this.p1.x-=spd;this.p1.facingRight=false;}
      if(this.cursors.right.isDown){this.p1.x+=spd;this.p1.facingRight=true;}
      if(this.cursors.up.isDown)this.p1.y-=spd*0.5;
      if(this.cursors.down.isDown)this.p1.y+=spd*0.5;
    }
    this.p1.x=Phaser.Math.Clamp(this.p1.x,170,630);
    this.p1.y=Phaser.Math.Clamp(this.p1.y,280,440);
    // Attacks
    if(this.cooldown<=0){
      if(this.keys.z.isDown&&this.p1.stamina>=10){this.doAttack(this.p1,this.p2,'strike');this.cooldown=300;}
      else if(this.keys.x.isDown&&this.p1.stamina>=20){this.doAttack(this.p1,this.p2,'grapple');this.cooldown=500;}
      else if(this.keys.c.isDown&&this.p1.finisher>=100){this.doAttack(this.p1,this.p2,'finisher');this.cooldown=800;}
    }
    // AI
    this.updateAI(delta);
    // Regen stamina
    this.p1.stamina=Math.min(100,this.p1.stamina+delta*0.02);
    this.p2.stamina=Math.min(100,this.p2.stamina+delta*0.02);
    this.p1.hitTimer=Math.max(0,this.p1.hitTimer-delta);
    this.p2.hitTimer=Math.max(0,this.p2.hitTimer-delta);
    // Check pin condition
    if(this.p2.hp<=0&&!this.pinActive){this.startPin(this.p2);}
    if(this.p1.hp<=0&&!this.pinActive){this.startPin(this.p1);}
    this.drawWrestler(this.p1Gfx,this.p1,b1);
    this.drawWrestler(this.p2Gfx,this.p2,b2);
    this.drawHUD();
    this.updateFloatingTexts(delta);
  }
  doAttack(atk,def,type){
    const dist=Phaser.Math.Distance.Between(atk.x,atk.y,def.x,def.y);
    if(dist>80&&type!=='finisher')return;
    if(dist>120)return;
    let dmg=0;
    if(type==='strike'){dmg=atk.data.pow*1.2+Math.random()*5;atk.stamina-=10;atk.combo++;}
    else if(type==='grapple'){dmg=atk.data.pow*1.5+atk.data.tec*0.5;atk.stamina-=20;atk.combo=0;}
    else if(type==='finisher'){dmg=atk.data.pow*4+20;atk.finisher=0;atk.combo=0;this.cameras.main.shake(400,0.02);this.spawnText(def.x,def.y-60,'FINISHER!','#ff0',28);}
    if(atk.combo>=3){dmg*=1.5;this.spawnText(atk.x,atk.y-70,'COMBO!','#0ff',22);atk.combo=0;}
    if(def.blocking)dmg*=0.5;
    dmg=Math.round(dmg);
    def.hp=Math.max(0,def.hp-dmg);
    def.hitTimer=150;
    atk.finisher=Math.min(100,atk.finisher+(type==='strike'?8:12));
    this.cameras.main.shake(100,0.005);
    this.spawnText(def.x,def.y-50,'-'+dmg,'#f44',18);
  }
  updateAI(delta){
    this.aiTimer-=delta;this.aiDashCooldown-=delta;
    if(this.aiTimer>0)return;
    const ai=this.p2,pl=this.p1,d=this.p2.data;
    const dist=Phaser.Math.Distance.Between(ai.x,ai.y,pl.x,pl.y);
    const spd=d.spd*0.35+0.8;
    ai.blocking=false;
    // Style-based AI
    if(d.style==='Powerhouse'||d.style==='Brawler'||d.style==='Aggressive'){
      // Chase aggressively
      if(dist>60){ai.x+=pl.x>ai.x?spd:-spd;ai.y+=pl.y>ai.y?spd*0.5:-spd*0.5;}
      else if(ai.stamina>=10){this.doAttack(ai,pl,ai.finisher>=100?'finisher':Math.random()>0.3?'strike':'grapple');this.aiTimer=400+Math.random()*200;}
    } else if(d.style==='Technical'||d.style==='Dirty Tricks'){
      // Keep distance, counter
      if(dist<50){ai.x+=pl.x>ai.x?-spd*2:spd*2;ai.blocking=true;this.aiTimer=200;}
      else if(dist<80&&ai.stamina>=20){this.doAttack(ai,pl,ai.finisher>=100?'finisher':'grapple');this.aiTimer=500;}
      else{ai.x+=pl.x>ai.x?spd*0.5:-spd*0.5;this.aiTimer=150;}
    } else if(d.style==='Highflyer'||d.style==='The Flash'){
      // Dash in/out
      if(this.aiDashCooldown<=0&&dist>100){ai.x+=(pl.x>ai.x?1:-1)*spd*4;this.aiDashCooldown=1500;this.aiTimer=100;}
      else if(dist<70&&ai.stamina>=10){this.doAttack(ai,pl,ai.finisher>=100?'finisher':'strike');this.aiTimer=300;ai.x+=(pl.x>ai.x?-1:1)*spd*3;}
      else{ai.x+=Math.sin(this.bounceT*2)*spd;this.aiTimer=100;}
    } else {
      // Default/Champion/Wildcard/Unpredictable
      if(dist>70){ai.x+=pl.x>ai.x?spd:-spd;}
      else if(Math.random()>0.4&&ai.stamina>=10){this.doAttack(ai,pl,ai.finisher>=100?'finisher':Math.random()>0.5?'strike':'grapple');this.aiTimer=350+Math.random()*300;}
      else{ai.blocking=Math.random()>0.5;this.aiTimer=300;}
    }
    ai.x=Phaser.Math.Clamp(ai.x,170,630);
    ai.y=Phaser.Math.Clamp(ai.y,280,440);
    if(!this.aiTimer||this.aiTimer<=0)this.aiTimer=150+Math.random()*100;
    ai.facingRight=pl.x>ai.x;
  }
  startPin(target){
    this.pinActive=true;this.pinTarget=target;this.pinMarker=0;this.pinDir=1;this.pinCount=0;
    this.pinGfx.setVisible(true);this.pinText.setVisible(true);
  }
  updatePin(delta){
    this.pinMarker+=this.pinDir*delta*0.4;
    if(this.pinMarker>200||this.pinMarker<0)this.pinDir*=-1;
    this.pinMarker=Phaser.Math.Clamp(this.pinMarker,0,200);
    // Green zone shrinks with less HP
    const hp=this.pinTarget===this.p1?this.p1.hp:0;// if player is pinned
    const zoneSize=Math.max(20,60*(Math.max(0,this.pinTarget.hp+30)/100));
    const zoneCenter=100;
    // Draw pin bar
    this.pinGfx.clear();
    this.pinGfx.fillStyle(0x333333);this.pinGfx.fillRect(300,300,200,20);
    this.pinGfx.fillStyle(0x00ff00);this.pinGfx.fillRect(300+zoneCenter-zoneSize/2,300,zoneSize,20);
    this.pinGfx.fillStyle(0xff0000);this.pinGfx.fillRect(300+this.pinMarker-3,298,6,24);
    this.pinCount+=delta;
    if(this.pinTarget===this.p1){
      // Player must kick out
      if(Phaser.Input.Keyboard.JustDown(this.keys.space)){
        if(Math.abs(this.pinMarker-zoneCenter)<zoneSize/2){
          // Kicked out!
          this.pinActive=false;this.pinGfx.setVisible(false);this.pinText.setVisible(false);
          this.p1.hp=15;this.spawnText(400,260,'KICKOUT!','#0f0',24);
        }
      }
      if(this.pinCount>3000){this.endRound(false);}
    } else {
      // AI tries to kick out based on remaining "virtual" HP
      if(this.pinCount>1500&&Math.random()<0.02){
        // AI might kick out if they had HP
        if(this.p2.hp>-20&&Math.random()<0.3){
          this.pinActive=false;this.pinGfx.setVisible(false);this.pinText.setVisible(false);
          this.p2.hp=10;this.spawnText(400,260,'KICKOUT!','#f80',24);return;
        }
      }
      if(this.pinCount>2500){this.endRound(true);}
    }
  }
  endRound(p1Won){
    this.gameOver=true;
    if(p1Won)this.p1Wins++;else this.p2Wins++;
    const msg=p1Won?ROSTER[this.p1Idx].name+' wins the round!':ROSTER[this.p2Idx].name+' wins the round!';
    this.add.text(400,200,msg,{fontSize:'28px',color:'#ff0',backgroundColor:'#000a'}).setOrigin(0.5);
    if(this.p1Wins>=2||this.p2Wins>=2){
      const winner=this.p1Wins>=2?ROSTER[this.p1Idx].name:ROSTER[this.p2Idx].name;
      this.add.text(400,240,winner+' WINS THE MATCH!',{fontSize:'24px',color:'#0f0'}).setOrigin(0.5);
      this.add.text(400,280,'ENTER to return',{fontSize:'16px',color:'#ccc'}).setOrigin(0.5);
      this.input.keyboard.once('keydown-ENTER',()=>{this.scene.start('TitleScene');});
    } else {
      this.add.text(400,240,'ENTER for next round',{fontSize:'16px',color:'#ccc'}).setOrigin(0.5);
      this.input.keyboard.once('keydown-ENTER',()=>{
        this.scene.start('FightScene',{p1:this.p1Idx,p2:this.p2Idx,p1Wins:this.p1Wins,p2Wins:this.p2Wins,round:this.round});
      });
    }
  }
  drawHUD(){
    const g=this.hudGfx;g.clear();
    // P1 health
    g.fillStyle(0x333333);g.fillRect(50,10,200,16);
    const hc1=this.p1.hitTimer>0?0xffffff:0x00cc00;
    g.fillStyle(hc1);g.fillRect(50,10,200*(this.p1.hp/100),16);
    // P2 health
    g.fillStyle(0x333333);g.fillRect(550,10,200,16);
    const hc2=this.p2.hitTimer>0?0xffffff:0xcc0000;
    g.fillStyle(hc2);g.fillRect(550,10,200*(this.p2.hp/100),16);
    // Stamina
    g.fillStyle(0x222222);g.fillRect(50,30,150,8);
    g.fillStyle(0x0088ff);g.fillRect(50,30,150*(this.p1.stamina/100),8);
    g.fillStyle(0x222222);g.fillRect(600,30,150,8);
    g.fillStyle(0x0088ff);g.fillRect(600,30,150*(this.p2.stamina/100),8);
    // Finisher
    g.fillStyle(0x222222);g.fillRect(50,42,150,8);
    g.fillStyle(0xffaa00);g.fillRect(50,42,150*(this.p1.finisher/100),8);
    g.fillStyle(0x222222);g.fillRect(600,42,150,8);
    g.fillStyle(0xffaa00);g.fillRect(600,42,150*(this.p2.finisher/100),8);
    // Names
    if(!this.nameText){
      this.nameText=true;
      this.add.text(50,52,ROSTER[this.p1Idx].name,{fontSize:'12px',color:'#fff'});
      this.add.text(750,52,ROSTER[this.p2Idx].name,{fontSize:'12px',color:'#fff'}).setOrigin(1,0);
    }
  }
  spawnText(x,y,text,color,size){
    const t=this.add.text(x,y,text,{fontSize:size+'px',color:color,fontStyle:'bold'}).setOrigin(0.5);
    this.floatingTexts.push({t,life:800});
  }
  updateFloatingTexts(delta){
    for(let i=this.floatingTexts.length-1;i>=0;i--){
      const f=this.floatingTexts[i];f.life-=delta;f.t.y-=delta*0.05;f.t.alpha=f.life/800;
      if(f.life<=0){f.t.destroy();this.floatingTexts.splice(i,1);}
    }
  }
}

const config={
  type:Phaser.AUTO,width:800,height:600,
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  scene:[TitleScene,FightScene],
  backgroundColor:'#000000'
};
new Phaser.Game(config);
</script>
<div id="touch-controls">
  <div class="dpad">
    <button class="up" data-key="ArrowUp">▲</button>
    <button class="left" data-key="ArrowLeft">◀</button>
    <button class="right" data-key="ArrowRight">▶</button>
    <button class="down" data-key="ArrowDown">▼</button>
  </div>
  <div class="actions">
    <button class="btn-z" data-key="z">Z<br>Strike</button>
    <button class="btn-x" data-key="x">X<br>Grab</button>
    <button class="btn-c" data-key="c">C<br>Finish</button>
    <button class="btn-block" data-key="ArrowDown">BLK</button>
    <button class="btn-space" data-key=" ">SPACE</button>
  </div>
</div>
<script>
// Show touch controls on touch devices
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  document.getElementById('touch-controls').classList.add('active');
}
// Wire touch buttons to keyboard events
document.querySelectorAll('#touch-controls button').forEach(btn=>{
  const key=btn.dataset.key;
  const sendKey=(type)=>{
    const ev=new KeyboardEvent(type,{key,code:key.length===1?'Key'+key.toUpperCase():key,bubbles:true});
    document.dispatchEvent(ev);
    const canvas=document.querySelector('canvas');
    if(canvas)canvas.dispatchEvent(ev);
  };
  btn.addEventListener('touchstart',(e)=>{e.preventDefault();sendKey('keydown');btn.dataset.held='1';});
  btn.addEventListener('touchend',(e)=>{e.preventDefault();sendKey('keyup');btn.dataset.held='0';});
  btn.addEventListener('touchcancel',(e)=>{e.preventDefault();sendKey('keyup');btn.dataset.held='0';});
  // Mouse fallback
  btn.addEventListener('mousedown',(e)=>{e.preventDefault();sendKey('keydown');btn.dataset.held='1';});
  btn.addEventListener('mouseup',(e)=>{e.preventDefault();sendKey('keyup');btn.dataset.held='0';});
  btn.addEventListener('mouseleave',(e)=>{if(btn.dataset.held==='1'){sendKey('keyup');btn.dataset.held='0';}});
});
</script>
